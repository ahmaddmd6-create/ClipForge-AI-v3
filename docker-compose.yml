services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clipforge-backend:latest
    container_name: clipforge-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8005}:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://clipforge:${POSTGRES_PASSWORD:-clipforge_secure_postgres_pass_2026}@db:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://*.vercel.app,http://localhost:5173,http://localhost:8080}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clipforge-backend:latest
    container_name: clipforge-worker
    restart: unless-stopped
    command: ["python", "-m", "backend.app.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://clipforge:${POSTGRES_PASSWORD:-clipforge_secure_postgres_pass_2026}@db:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: clipforge-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: clipforge-db
    environment:
      POSTGRES_DB: clipforge
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipforge_secure_postgres_pass_2026}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge -d clipforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clipforge-frontend:latest
    container_name: clipforge-frontend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
